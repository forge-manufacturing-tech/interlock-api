[project]
name = "ui"
version = "0.1.0"
description = "Frontend UI package for Interlock using Rio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rio-ui>=0.10.0",
    "httpx>=0.27.0",
    "api-client",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
