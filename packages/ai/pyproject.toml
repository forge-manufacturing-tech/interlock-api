[project]
name = "ai"
version = "0.1.0"
description = "AI logic for Interlock"
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai[openai]>=0.0.1",
    "pydantic-monty>=0.0.7",
    "python-dotenv>=1.2.1",
    "orm",
    "models",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
orm = { workspace = true }
models = { workspace = true }
