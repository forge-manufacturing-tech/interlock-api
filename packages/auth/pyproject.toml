[project]
name = "auth"
version = "0.1.0"
description = "Authentication and API key management for Interlock"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "database",
    "pydantic>=2.0.0",
    "bcrypt>=4.0.0",
    "PyJWT>=2.8.0",
    "fastapi>=0.128.5",
]

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
database = { workspace = true }
