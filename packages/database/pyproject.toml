[project]
name = "database"
version = "0.1.0"
description = "PostgreSQL database manager for Interlock API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0",
    "alembic",
    "sqlalchemy",
    "psycopg2-binary",
    "python-dotenv",
    "sqlmodel",
    "sqlalchemy-cockroachdb>=2.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
