[project]
name = "deploy-gcp"
version = "0.1.0"
description = "Deployment scripts for Google Cloud"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-functions>=1.22.0",
    "google-cloud-storage>=3.9.0",
]

[project.scripts]
deploy-gcp = "deploy_gcp.main:main"

[build-system]
requires = ["uv_build>=0.4.0"]
build-backend = "uv_build"
