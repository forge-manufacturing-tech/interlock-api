[project]
name = "interlock-api"
version = "0.1.0"
description = "Interlock Monorepo Workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai>=2.17.0",
    "psycopg2-binary>=2.9.11",
    "pymupdf>=1.27.1",
    "scalar-fastapi>=1.6.1",
]

[tool.uv.workspace]
members = [
    "packages/*",
    "apps/*"
]

[dependency-groups]
dev = [
    "ruff>=0.15.0",
    "ty>=0.0.15",
    "core",
    "ai",
    "parsers",
    "api",
    "database",
    "orm",
    "auth",
    "storage",
]

[tool.uv.sources]
core = { workspace = true }
ai = { workspace = true }
parsers = { workspace = true }
api = { workspace = true }
deploy-gcp = { workspace = true }
database = { workspace = true }
orm = { workspace = true }
auth = { workspace = true }
storage = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 300

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.Security",
    "fastapi.UploadFile",
]
